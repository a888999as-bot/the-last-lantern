  <script type="module">

const story = {
  id: 'last-lantern-v1',
  title: 'The Last Lantern',
  nodes: {
    arrival: {
      chapter: '01',
      kicker: 'Bracken Station · before dawn',
      title: 'A parcel that ticks',
      art: 'station',
      paragraphs: [
        'Your final delivery weighs almost nothing. Inside its paper wrapping, something ticks once whenever you stop walking.',
        'At Bracken Station, night hangs above the platform on a clock with no minute hand. The Midnight Post waits beside a single lamp. Beyond the fence, the valley is entirely dark.',
        'The stationkeeper checks your courier badge. “Last service. At dawn we close for good. Two passengers, two destinations. The driver has time for one branch before taking the train to the depot.”',
        'She sees the parcel and straightens her collar. “Oh. They remembered.”',
      ],
      choices: [
        { id: 'meet', label: 'Meet the passengers', detail: 'Find out who is waiting, and why.', to: 'gardener' },
      ],
    },
    gardener: {
      chapter: '02',
      kicker: 'The northern branch',
      title: 'An orchard in a box',
      art: 'garden',
      paragraphs: [
        'Mira sits beside a wooden box with air holes. Warm green shoots press against them.',
        '“An orchard in a box,” she says. “The old trees washed away last winter. These are their cuttings.” She has written each tree’s name on a little strip of cloth.',
        'Her little brother has waited up to plant the first one with her at sunrise. Orchard Halt is twelve miles along the northern rail.',
        '“He’ll forgive me if I’m late.” She turns the box so the shoots face the lamp. “That’s almost worse.”',
      ],
      choices: [
        { id: 'promise-mira', label: '“I’ll try to get you home.”', detail: 'Give Mira your word before you know every option.', to: 'clockmaker', effects: { promise: 'mira' } },
        { id: 'listen-first', label: '“Let me understand our options first.”', detail: 'Keep your promise unspoken for now.', to: 'clockmaker' },
      ],
    },
    clockmaker: {
      chapter: '03',
      kicker: 'The southern branch',
      title: 'A moon running late',
      art: 'clock',
      paragraphs: [
        'Oren has a clock face tucked under one arm. Its painted moon wears an expression of mild surprise.',
        '“For the harbor clock,” he explains. “My daughter made the moon. I’m supposed to fit it before her first morning on the ferry.”',
        'Harbor Steps lies fourteen miles down the southern rail. He notices Mira’s box. “Her seedlings can have my seat.”',
        'You explain that the driver can reach only one destination before the depot. “Ah.” Oren polishes a perfectly clean patch of brass. “I was hoping it was a seating problem.”',
      ],
      choices: [
        { id: 'promise-oren', label: '“I’ll try to get you home.”', detail: 'Give Oren your word.', to: 'parcel', requires: { promise: null }, effects: { promise: 'oren' } },
        { id: 'open-delivery', label: '“Let’s examine that delivery.”', detail: 'There is still a parcel to deliver.', to: 'parcel' },
      ],
    },
    parcel: {
      chapter: '04',
      kicker: 'The final delivery',
      title: 'For someone going home',
      art: 'lantern',
      paragraphs: [
        'The stationkeeper, Nessa, cuts the string with a ticket punch. Inside is a beautiful walking lantern. Underneath lies a card:',
        '“For forty years of getting everyone else home. Your next journey is yours.”',
        'Nessa reads it twice. “My retirement present,” she says. “I thought it would be a commemorative plate.”',
        'The lantern ticks as she lifts it. A tiny mechanism inside turns the wick toward the glass. Its handle fits her hand as though somebody measured it.',
        '“Enough oil for a long walk,” she adds. Then, more quietly: “I used to enjoy those.”',
      ],
      choices: [
        { id: 'look-around', label: '“There may be another way out.”', detail: 'Look beyond the railway.', to: 'explore' },
      ],
    },
    explore: {
      chapter: '05',
      kicker: 'Forty minutes before sunrise',
      title: 'The station has other doors',
      art: 'station',
      paragraphs: [
        'Nessa gives you the station keys. Forty minutes remain before sunrise. The driver is checking the brakes; you have time to look around.',
        'The office door bears an old walking-tour emblem. Beyond the platform fence, a narrow gate rattles softly.',
        '“We mostly stopped using those when the railway opened,” Nessa says. “Funny how a new way somewhere can make you forget the old one.”',
        { when: { mapRead: true }, text: 'You know the old walking route now: across the gorge, through the orchard, then down to the harbor.' },
        { when: { bridgeChecked: true }, text: 'You have checked the bridge. Its deck is sound, and the gate stands open.' },
      ],
      choices: [
        { id: 'visit-map', label: 'Check the office maps', detail: 'Find out where the old paths lead.', to: 'map_room', unless: { mapRead: true } },
        { id: 'visit-bridge', label: 'Inspect the gate', detail: 'See whether the footbridge is passable.', to: 'footbridge', unless: { bridgeChecked: true } },
        { id: 'return-keeper', label: 'Return to Nessa', detail: 'You can come back to investigate before choosing.', to: 'keeper' },
      ],
    },
    map_room: {
      chapter: '06',
      kicker: 'Under the railway map',
      title: 'The short way round',
      art: 'map',
      paragraphs: [
        'The newest rail map shows a great horseshoe around the valley: Orchard Halt at one end, Harbor Steps at the other.',
        'Underneath it, an older walking map shows something much simpler. A footbridge crosses the gorge behind the station. The orchard is fifteen minutes away on foot. Steps from its lower gate reach the harbor ten minutes later.',
        'The railway curves around the gorge. Feet can go over it, visiting both places before dawn.',
        'You trace the bridge in pencil. Someone has written beside it: “Bring a lamp. Unlit after the fork.”',
      ],
      choices: [
        { id: 'remember-map', label: 'Keep the route in mind', detail: 'The map shows a way to reach both homes.', to: 'explore', effects: { mapRead: true } },
      ],
    },
    footbridge: {
      chapter: '07',
      kicker: 'Beyond the platform fence',
      title: 'What the dark was hiding',
      art: 'bridge',
      paragraphs: [
        'The gate opens onto a stone bridge. Ferns grow in its joints, but the deck is solid. You cross as far as the middle, testing every step.',
        'On the far bank, two signposts point into darkness. You cannot read them from here.',
        'A cloud shifts. For a moment you see the orchard windows above you and the harbor lights below. Both are startlingly close.',
        'You return and wedge the gate open. The path needs light, but it is passable. Across the gorge, a kitchen window brightens.',
      ],
      choices: [
        { id: 'confirm-bridge', label: 'Return with what you found', detail: 'The bridge can carry your little group.', to: 'explore', effects: { bridgeChecked: true } },
      ],
    },
    keeper: {
      chapter: '08',
      kicker: 'The last shift',
      title: 'One more person waiting',
      art: 'lantern',
      paragraphs: [
        'Nessa is taking the station clock off its hook. “Everyone thinks I live upstairs,” she says. “That’s the linen cupboard.”',
        'Her home is a small room above the harbor bakery. She hasn’t seen it in daylight for years. “I could walk with them,” she says, looking at her present. “If there’s a safe route.”',
        'Inside the lantern, its clockwork spring turns the wick. Someone made it for a woman who would finally have time to walk.',
        'She hands you the train’s destination wheel. “The driver is waiting for our signal. Where do we go?”',
      ],
      choices: [
        { id: 'consider-route', label: 'Decide how we leave', detail: 'Choose the journey you are willing to make.', to: 'decision' },
      ],
    },
    decision: {
      chapter: '09',
      kicker: 'The departure signal',
      title: 'Choose a way home',
      art: 'station',
      paragraphs: [
        'The wheel has two brass stops: ORCHARD and HARBOR. Either rail route connects with the dawn mail service. Your through-ticket will keep your next delivery on time.',
        'Walking means missing that connection. You would need the morning coach, and your next customer would have to wait.',
        { when: { promise: 'mira' }, text: 'You remember your promise to Mira. The cloth labels on her seedlings flutter in the wind.' },
        { when: { promise: 'oren' }, text: 'You remember your promise to Oren. He is holding the painted moon carefully by its edges.' },
        { when: { mapRead: true, bridgeChecked: true }, text: 'You have found a sound bridge and a route past both homes. With Nessa’s lantern, you could all walk together.' },
      ],

// engine.js

function createRun(now = Date.now(), id = `journey-${now}`) {
  return { version: 1, storyId: story.id, id, nodeId: 'arrival', flags: { promise: null, mapRead: false, bridgeChecked: false }, path: [], startedAt: now, completedAt: null };
}

function matches(flags, condition) {
  return !condition || Object.entries(condition).every(([key, value]) => flags[key] === value);
}

function currentNode(run) {
  return story.nodes[run.nodeId];
}

function availableChoices(run) {
  return (currentNode(run).choices || []).filter(choice => matches(run.flags, choice.requires) && (!choice.unless || !matches(run.flags, choice.unless)));
}

function paragraphsFor(run) {
  return currentNode(run).paragraphs.filter(paragraph => typeof paragraph === 'string' || matches(run.flags, paragraph.when)).map(paragraph => typeof paragraph === 'string' ? paragraph : paragraph.text);
}

function choose(run, choiceId, now = Date.now()) {
  const choice = availableChoices(run).find(item => item.id === choiceId);
  if (!choice || !story.nodes[choice.to]) throw new Error('This choice is not available.');
  return { ...run, nodeId: choice.to, flags: { ...run.flags, ...choice.effects }, path: [...run.path, { from: run.nodeId, choiceId }], completedAt: story.nodes[choice.to].ending ? now : null };
}

function restoreRun(value, now = Date.now()) {
  if (!value || value.version !== 1 || value.storyId !== story.id || !Array.isArray(value.path) || value.path.length > 60 || typeof value.id !== 'string' || value.id.length > 100) return null;
  if (!Number.isFinite(value.startedAt) || value.startedAt <= 0) return null;
  try {
    let restored = createRun(Math.min(value.startedAt, now), value.id);
    for (const step of value.path) {
      if (step.from !== restored.nodeId) return null;
      restored = choose(restored, step.choiceId, now);
    }
    if (currentNode(restored).ending && Number.isFinite(value.completedAt)) restored.completedAt = Math.min(now, Math.max(restored.startedAt, value.completedAt));
    return restored;
  } catch { return null; }
}

function rewind(run) {
  return restoreRun({ ...run, path: run.path.slice(0, -1), completedAt: null });
}

function makePlaytest(run, feedback, endings, now = Date.now()) {
  return { format: 'last-lantern-playtest-v1', exportedAt: new Date(now).toISOString(), completed: Boolean(currentNode(run).ending), ending: currentNode(run).ending?.id || null, endingsFound: [...new Set(endings)], choiceCount: run.path.length, elapsedSeconds: Math.max(0, Math.round(((run.completedAt || now) - run.startedAt) / 1000)), discoveries: { map: run.flags.mapRead, bridge: run.flags.bridgeChecked }, promise: run.flags.promise, choices: run.path, wantsChapterTwo: ['yes','maybe','no'].includes(feedback) ? feedback : null };
}

function chime() {
  if (!soundOn || !audioContext) return;
  void audioContext.resume();
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const at = audioContext.currentTime;
  oscillator.type = 'sine';
  oscillator.frequency.setValueAtTime(440, at);
  oscillator.frequency.exponentialRampToValueAtTime(660, at + .15);
  gain.gain.setValueAtTime(.0001, at);
  gain.gain.exponentialRampToValueAtTime(.035, at + .03);
  gain.gain.exponentialRampToValueAtTime(.0001, at + .7);
  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start(at);
  oscillator.stop(at + .72);
}

        <div class="scene-art">${sceneArt(node.art)}<div class="scene-overlay"></div><span class="scene-coordinates">${info[2]}</span></div>
        <h2 class="scene-title">${info[0]}</h2><p class="scene-description">${info[1]}</p>
        <div class="progress-track" aria-label="Story progress">${['Arrival', 'Discoveries', 'Decision', 'Ending'].map((label, i) => `<span class="progress-step ${i === progress ? 'active' : i < progress ? 'done' : ''}" ${i === progress ? 'aria-current="step"' : ''}>${label}</span>`).join('')}</div>
      </aside>
      <section class="story-panel reveal" aria-labelledby="story-title">
        ${node.ending ? '<div class="ending-seal" aria-hidden="true">✧</div>' : ''}
        <div class="eyebrow">${esc(node.ending ? 'Your ending · ' + node.kicker : node.kicker)}</div>
        <h1 class="story-heading" id="story-title">${esc(node.title)}</h1>
        ${node.ending ? `<p class="ending-caption">${esc(node.ending.caption)}</p>` : ''}
        <div class="story-body">${paragraphsFor(state.run).map(p => `<p>${esc(p)}</p>`).join('')}</div>
        ${node.ending ? `
          <div class="ending-actions"><button class="primary" data-action="restart">Find another way <span class="arrow" aria-hidden="true">↺</span></button><button class="text-link" data-action="home">Back to the station</button></div>
          <p class="ending-counter">${state.endings.length} of 3 endings found</p>
          <section class="feedback-card" aria-labelledby="feedback-title">
            <h3 id="feedback-title">Would you play Chapter Two?</h3>
            <p>Your first impression helps shape the next story.</p>
            <div class="feedback-options" role="group" aria-label="Would you play Chapter Two?">${[['yes','Yes, I’d come back'],['maybe','Maybe'],['no','Not for me']].map(([value,label])=>`<button data-action="feedback" data-value="${value}" aria-pressed="${feedback === value}">${label}</button>`).join('')}</div>
            <div class="feedback-foot"><button class="text-link" data-action="export">Download playtest notes ↓</button><span>Saved on this device. Nothing is sent.</span></div>
          </section>` : `
          <div class="choice-heading">${availableChoices(state.run).length === 1 ? 'Your next step' : 'What will you do?'}</div>
          <div class="choices">${availableChoices(state.run).map((choice,i)=>`<button class="choice ${choice.id === 'choose-walk' ? 'special' : ''}" data-action="choose" data-choice="${choice.id}"><span class="choice-num" aria-hidden="true">${i+1}</span><span class="choice-label">${esc(choice.label)}<small>${esc(choice.detail || '')}</small></span><span class="choice-arrow" aria-hidden="true">→</span></button>`).join('')}</div>`}
        <div class="reader-tools">
          ${state.run.path.length ? '<button class="back-choice" data-action="back">← Previous choice</button>' : '<span></span>'}
          <span class="save-status"><span class="save-dot"></span>${storageWorks ? 'Saved on this device' : 'Session only · storage unavailable'}</span>
        </div>
      </section>
    </article>`;
  updateNotes();
  if (focus) focusMain();
}
function newJourney() {
  const hadJourney = Boolean(state.run);
  state.run = createRun(Date.now(), globalThis.crypto?.randomUUID?.() || `journey-${Date.now()}`);
  state.feedback = {};
  save();
  track(hadJourney ? 'story_restart' : 'story_start');
  renderStory();
}
function openDialog(content) {
  document.querySelector('#dialog-content').innerHTML = content;
  document.querySelector('#dialog-content h2').id = 'dialog-title';
  dialog.setAttribute('aria-labelledby', 'dialog-title');
  if (!dialog.open) dialog.showModal();
}
function showNotes() {
  const flags = state.run?.flags || {};
  const notes = [
    flags.mapRead && ['The office map', 'The footpath crosses the gorge, visits the orchard, then descends to the harbor. Bring a lamp.'],
    flags.bridgeChecked && ['The old bridge', 'The stone deck is sound. The gate is open. The route beyond it is unlit.'],
    flags.promise && ['A promise made', `You told ${flags.promise === 'mira' ? 'Mira' : 'Oren'} you would try to get them home.`],
  ].filter(Boolean);
  openDialog(`<div class="eyebrow">Collected along the way</div><h2>Field notes</h2>${notes.length ? notes.map(([title,text])=>`<div class="note-item"><h3>${title}</h3><p>${text}</p></div>`).join('') : '<p class="empty-note">An empty page, for now.<br>There are things to discover at Bracken.</p>'}<div class="note-item"><small>${state.endings.length} of 3 endings found</small><p>Discoveries belong to this journey. Found endings stay with you.</p></div>`);
}
function exportNotes() {
  const report = makePlaytest(state.run, state.feedback[state.run.id], state.endings);
  const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2) + '\n'], {type:'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = `last-lantern-playtest-${state.run.id.slice(0,8)}.json`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Playtest notes downloaded. Share them only if you wish.');
}
document.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  event.preventDefault();
  switch (button.dataset.action) {
    case 'begin': newJourney(); break;
    case 'continue': renderStory(); break;
    case 'home': showLanding(true); break;
    case 'choose': {
      const before = state.run.flags;
      state.run = choose(state.run, button.dataset.choice);
      const ending = currentNode(state.run).ending;
      if (ending && !state.endings.includes(ending.id)) state.endings.push(ending.id);
      save();
      if (ending) track('story_complete');
      chime();
      renderStory();
      if (!before.mapRead && state.run.flags.mapRead) toast('Field note added: the old walking route');
      if (!before.bridgeChecked && state.run.flags.bridgeChecked) toast('Field note added: the sound bridge');
      break;
    }
    case 'back': state.run = rewind(state.run); save(); renderStory(); break;
    case 'restart':
      openDialog('<div class="eyebrow">Another way home</div><h2>Start a new journey?</h2><p>Your current choices will reset. The endings you have found will stay in your collection.</p><div class="dialog-actions"><button class="primary" data-action="confirm-restart">Begin again <span aria-hidden="true">→</span></button><button class="text-link" data-action="close-dialog">Keep this journey</button></div>');
      break;
    case 'confirm-restart': dialog.close(); newJourney(); break;
    case 'close-dialog': dialog.close(); break;
    case 'notes': showNotes(); break;
    case 'about':
      openDialog('<div class="eyebrow">The first chapter</div><h2>A story worth a small detour.</h2><p>The Last Lantern is an original, written branching story from Echo Trails. Every path has a complete ending. There is no timer, and you can revisit an earlier choice.</p><p>This prototype uses authored story branches. Your choices and optional feedback stay in this browser. Downloading playtest notes creates a file you can choose to share.</p><p>Sound is optional. No accounts, payments, or external services are needed to play.</p>');
      break;
    case 'sound':
      try {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!audioContext) audioContext = new Audio();
        soundOn = !soundOn;
        button.setAttribute('aria-pressed', String(soundOn));
        button.innerHTML = `<span aria-hidden="true">♪</span> Sound ${soundOn ? 'on' : 'off'}`;
        chime();
      } catch { toast('Sound is not available in this browser.'); }
      break;
    case 'feedback':
      state.feedback[state.run.id] = button.dataset.value;
      save();
      document.querySelectorAll('[data-action="feedback"]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.value === button.dataset.value)));
      toast('Thank you. Your answer is saved on this device.');
      break;
    case 'export': exportNotes(); break;
  }
});
dialog.addEventListener('click', event => { if (event.target === dialog) { const rect = dialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close(); } });
window.addEventListener('hashchange', () => {
  if (location.hash === '#story' && state.run) renderStory(false);
  else if (!location.hash || location.hash === '#') showLanding(false);
});
if (location.hash === '#story' && state.run) renderStory(false); else showLanding();

</script>
